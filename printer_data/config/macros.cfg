[gcode_macro START_PRINT]
description: "Initialise the print" 

variable_bed_type: "undefined"
variable_last_min_x: 0
variable_last_min_y: 0
variable_last_max_x: 0
variable_last_max_y: 0

gcode: 
    #Parameters
   {% set tH = params.T_HOTEND|default(270)|int %}
   {% set tB = params.T_BED|default(110)|int %}
   {% set tP = params.T_PROBE|default(140)|int %}
   {% set nswait = namespace(wait = params.WAIT|default(0)|float) %}
   {% set bt = params.BED_TYPE|default("not set")|string %}

   {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}                                # Gather all object points
   {% set bed_mesh_min = printer.configfile.settings.bed_mesh.mesh_min %}                                                          # Get bed mesh min from printer.cfg
   {% set bed_mesh_max = printer.configfile.settings.bed_mesh.mesh_max %}                                                          # Get bed mesh max from printer.cfg
   {% set x_min = all_points | map(attribute=0) | min | default(bed_mesh_min[0]) %}                                                # Set x_min from smallest object x point
   {% set y_min = all_points | map(attribute=1) | min | default(bed_mesh_min[1]) %}                                                # Set y_min from smallest object y point
   {% set x_max = all_points | map(attribute=0) | max | default(bed_mesh_max[0]) %}                                                # Set x_max from largest object x point
   {% set y_max = all_points | map(attribute=1) | max | default(bed_mesh_max[1]) %}                                                # Set y_max from largest object y point
   {% set print_width  = x_max - x_min %}
   {% set print_depth  = y_max - y_min %}

   # GCode 
   CLEAR_PAUSE
   #SET_FILAMENT_SENSOR SENSOR=FilamentSensor ENABLE=0
   UPDATE_DELAYED_GCODE ID=kill_fan DURATION=0
   M220 S100
   M107                                     ; turn off fan
   G90
   M83
   M104 S150
   M140 S{ tB }
   _CG28
   QGL_COARSE
   G1 X175 Y250 Z50
   M190 S{ tB }                              ; wait for bed temperature
   M106 S51                                 ; set fan speed
   {% if tB > 85 %}
     {% set nswait.wait = nswait.wait + 90 %}
   {% endif %}
   {% if nswait.wait > 0 %}                         ; wait for period
    G4 P{ nswait.wait * 1000 }
   {% endif %}
   SET_VELOCITY_LIMIT ACCEL=10000
   QGL_FINE
   {% if params.PROBE_DEVIATION|default(0)|int == 1 %}            ; test probe accuracy
    PROBE_ACCURACY
   {% endif %}
   {% set ns = namespace(reuse = false) %}
   {% if x_min < printer["gcode_macro START_PRINT"].last_min_x %}{% set ns.reuse = false %}{% endif %}
   {% if y_min < printer["gcode_macro START_PRINT"].last_min_y %}{% set ns.reuse = false %}{% endif %}
   {% if x_max > printer["gcode_macro START_PRINT"].last_max_x %}{% set ns.reuse = false %}{% endif %}
   {% if y_max > printer["gcode_macro START_PRINT"].last_max_y %}{% set ns.reuse = false %}{% endif %}
   {% if ns.reuse and bt == printer["gcode_macro START_PRINT"].bed_type %}
     BED_MESH_PROFILE LOAD=kamplast
   {% else %}
     BED_MESH_CALIBRATE                        ; probe bed mesh
     BED_MESH_PROFILE SAVE=kamplast
     SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=last_min_x VALUE={x_min}
     SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=last_min_y VALUE={y_min}
     SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=last_max_x VALUE={x_max}
     SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=last_max_y VALUE={y_max}
     SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=bed_type VALUE='"{bt}"'
   {% endif %}
   M104 S{ tH }                              ; start final heating
   SET_VELOCITY_LIMIT ACCEL=1000
   SMART_PARK                                ; park for heating
   M107                                      ; stop fan
   M109 S{ tH }                              ; wait for hotend
   ;SET_FILAMENT_SENSOR SENSOR=FilamentSensor ENABLE=1
   SET_LED LED="toolhead_light" RED=0 GREEN=0 BLUE=0 WHITE=1 SYNC=0 TRANSMIT=1
   G92 E0                                    ; reset extruder
   VORON_PURGE                                ; purge extruder
   ;SKEW_PROFILE LOAD=calilantern_skew_profile

[gcode_macro END_PRINT]
description: "End the print"
gcode: 
  #Parameters
  {% set fanWait = params.FAN_WAIT|default(300)|int %}

  #gcode
  G90
  SET_SKEW CLEAR=1
  SET_VELOCITY_LIMIT ACCEL=10000
  M220 S100
  M104 S{ printer.configfile.settings.extruder.min_extrude_temp }    ;starting winding down extruder
  G1 E-1.0 F4200                                                     ; retract
  G1 X0 Z{ [printer.toolhead.position.z + 20, printer.toolhead.axis_maximum.z] | min } F3200 ; move print head up & retract filament
  G92 E0                                                             ; reset extruder
  G1 E-19 F1800
  G1 Y{ printer.toolhead.axis_maximum.y - 20 } F1200                                                      ;present print
  M106 S51                                                          ; max fan
  M104 S0                                                            ; turn off temperature
  {% if params.KEEP_BED|default(0)|int != 1 %}
  M140 S0                                                            ; turn off heatbed
  {% endif %}
  {% if params.HOLD_MOTOR|default(0)|int == 0 %}
  M84                                                                ; disable motors
  SET_LED LED="toolhead_light" RED=0 GREEN=0 BLUE=0 WHITE=0 SYNC=0 TRANSMIT=1
  {% endif %}
  UPDATE_DELAYED_GCODE ID=kill_fan DURATION={ fanWait }

[gcode_macro _CG28]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% else %}
        G28 Z
    {% endif %}

[gcode_macro QGL_COARSE]
description: "Basic QGL"
variable_coarse_done: 0
gcode: 
	{% if "xyz" not in printer.toolhead.homed_axes %}
		_CG28
	{% endif %}
	QUAD_GANTRY_LEVEL RETRY_TOLERANCE=0.015 SAMPLES=1
	SET_GCODE_VARIABLE MACRO=QGL_COARSE VARIABLE=coarse_done VALUE=1

[gcode_macro QGL_FINE]
description: "Fine QGL"
gcode: 
	{% if printer["gcode_macro QGL_COARSE"].coarse_done == 0 %}
	M118 No coarse adjustment done. Performing that first. 
	QGL_COARSE
	{% endif %}
	_CG28
	QUAD_GANTRY_LEVEL RETRY_TOLERANCE=0.004 SAMPLES=6 HORIZONTAL_MOVE_Z=1
	SET_GCODE_VARIABLE MACRO=QGL_COARSE VARIABLE=coarse_done VALUE=0

[gcode_macro DUMP_VARIABLES]
gcode:
    {% set filter_name = params.NAME|default('')|string|lower %}
    {% set filter_value = params.VALUE|default('')|string|lower %}
    {% set show_cfg = params.SHOW_CFG|default(0)|int %}
    
    {% set out = [] %}

    {% for key1 in printer %}
        {% for key2 in printer[key1] %}
            {% if (show_cfg or not (key1|lower == 'configfile' and key2|lower in ['config', 'settings'])) and (filter_name in key1|lower or filter_name in key2|lower) and filter_value in printer[key1][key2]|string|lower %}
                {% set dummy = out.append("printer['%s'].%s = %s" % (key1, key2, printer[key1][key2])) %}
            {% endif %}
        {% else %}
            {% if filter_name in key1|lower and filter_value in printer[key1]|string|lower %}
                {% set dummy = out.append("printer['%s'] = %s" % (key1, printer[key1])) %}
            {% endif %}
        {% endfor %}
    {% endfor %}
    
    {action_respond_info(out|join("\n"))}

[gcode_macro GET_VARIABLE]
gcode:
    {% set names = (params.NAME).split('.')|list %}
    {% set join = (params.JOIN)|default(1)|int %}
    
    {% set _dummy0 = namespace( break = 0 ) %}
    {% set _dummy1 = namespace( out = printer[names|first] ) %}
    
    {% for name in names if _dummy0.break == 0 %}
        {% if loop.index > 1 %}
            {% if name in _dummy1.out %}
                {% set _dummy1.out = _dummy1.out[name] %}
            {% elif name[0] in '0123456789' and _dummy1.out is iterable and _dummy1.out is not string and _dummy1.out is not mapping and _dummy1.out|length > name[0]|int %}
                {% set _dummy1.out = _dummy1.out[name|int] %}
            {% else %}
                {% set _dummy0.break = loop.index0 %}
            {% endif %}
        {% endif %}
    {% endfor %}
    
    {% if _dummy1.out is boolean %}
        { action_respond_info('Type: boolean') }
    {% elif _dummy1.out is float %}
        { action_respond_info('Type: float') }
    {% elif _dummy1.out is integer %}
        { action_respond_info('Type: integer') }
    {% elif _dummy1.out is mapping %}
        { action_respond_info('Type: mapping') }
    {% elif _dummy1.out is string %}
        { action_respond_info('Type: string') }
    {% elif _dummy1.out is iterable %}
        { action_respond_info('Type: iterable') }
    {% elif _dummy1.out is none %}
        { action_respond_info('Type: none') }
    {% elif _dummy1.out is undefined %}
        { action_respond_info('Type: undefined') }
    {% elif _dummy1.out is callable %}
        { action_respond_info('Type: callable') }
    {% else %}
        { action_respond_info('Type: unknown') }
    {% endif %}
    
    {% if join and _dummy1.out is iterable and _dummy1.out is not string and _dummy1.out is not mapping %}
        { action_respond_info('%s' % _dummy1.out|join("\n")) }
    {% else %}
        { action_respond_info('%s' % _dummy1.out) }
    {% endif %}
    
    {% if _dummy0.break != 0 %}
        { action_respond_info('"printer.%s" does not contain "%s"!' % (names[0:_dummy0.break]|join('.'), names[_dummy0.break])) }
    {% endif %}

# Park front center
[gcode_macro PARKFRONT]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                           ; home if not already homed
    {% endif %}
    SAVE_GCODE_STATE NAME=PARKFRONT
    G90                               ; absolute positioning
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} Z{printer.toolhead.axis_maximum.z/2} F6000        
    RESTORE_GCODE_STATE NAME=PARKFRONT

# Park front center, but low down.
[gcode_macro PARKFRONTLOW]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                           ; home if not already homed
    {% endif %}
    SAVE_GCODE_STATE NAME=PARKFRONT
    G90                              ; absolute positioning
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} Z20 F6000                                     
    RESTORE_GCODE_STATE NAME=PARKFRONT

# Park top rear left
[gcode_macro PARKREAR]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                           ; home if not already homed
    {% endif %}
    SAVE_GCODE_STATE NAME=PARKREAR
    G90                              ; absolute positioning
    G0 X{printer.toolhead.axis_minimum.x+10} Y{printer.toolhead.axis_maximum.y-10} Z{printer.toolhead.axis_maximum.z-50} F6000     
    RESTORE_GCODE_STATE NAME=PARKREAR

# Park at center of build volume
[gcode_macro PARKCENTER]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
